<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8F3032">
<meta name="color-scheme" content="light only">
<title>Ficha de Ponto BERG</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#F5F1EA; --surface:#ffffff; --surface-2:#FFFCF8; --ink:#1E1E1E; --muted:#6E6659; --line:#DED4C1;
  --accent:#8F3032; --accent-ink:#ffffff; --sel:#F3E2E2; --warn:#9A6B1E; --warn-bg:#F3E7CE;
  --danger:#B42318; --danger-bg:#FDECEA; --ok:#3F6B3F; --ok-bg:#E1EBDD;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:#8F3032;color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;align-items:center;gap:10px}
.top h1{font-size:18px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12px;opacity:.85}
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 4px;text-align:center}
.hero img{width:132px;height:132px;background:#fff;border-radius:50%;padding:4px;box-shadow:0 2px 10px rgba(32,31,30,.12)}
.hero .t{font-size:21px;font-weight:800;letter-spacing:.2px}
.hero .s{font-size:13.5px;color:var(--muted)}
.top button,.top select{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:7px 10px;font-size:14px}
.top select option{color:#000}
.top select{max-width:46%}
.band{color:#fff;padding:8px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.band small{font-weight:400;opacity:.9}
.progress{height:4px;background:var(--line)}.progress i{display:block;height:100%;background:var(--accent)}
.main{flex:1;padding:14px 14px 24px;display:flex;flex-direction:column;gap:16px}
.bottom{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;font-size:16px;cursor:pointer;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.big{padding:18px;font-size:19px;font-weight:700;width:100%}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.4}
.bottom .btn{flex:1;font-weight:700}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.banner{border-radius:10px;padding:10px 12px;font-size:15px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner.warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.banner.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.banner.info{background:var(--sel);border:1px solid var(--accent)}
.banner.danger-b{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger)}
.banner .btn{flex:none}
.ctools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cbtn{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.cbtn.on{box-shadow:0 0 0 3px var(--accent)}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:14px;cursor:pointer}
.tbtn.on{border-color:var(--accent);background:var(--sel);font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.card{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.card.sel{background:var(--sel);border-color:var(--accent)}
.card b{font-size:17px}
.selr{display:flex;align-items:center;gap:10px}
.selbox{width:26px;height:26px;border-radius:6px;border:2px solid var(--muted);display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none}
.selbox.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.selall{background:var(--surface-2)}
.btn.primary.delbtn{background:var(--danger);border-color:var(--danger);color:#fff}
.card .meta{font-size:13px;color:var(--muted)}
.chip{font-size:12px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
.chip.draft{background:var(--warn-bg);color:var(--warn)}
.chip.final{background:var(--sel);color:var(--accent)}
.chip.exp{background:var(--ok-bg);color:var(--ok)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
h2{font-size:17px;margin:6px 0 0}
.muted{color:var(--muted);font-size:14px}
.q{display:flex;flex-direction:column;gap:7px}
.qlabel{display:flex;gap:8px;align-items:flex-start;font-weight:700}
.qlabel .txt{flex:1;min-width:0}
.req{color:var(--danger)}
.gbtn{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--warn);color:var(--warn);background:var(--warn-bg);font-weight:800;padding:0;cursor:pointer}
.gbtn[aria-expanded="true"]{background:var(--warn);color:var(--surface)}
.guid{background:var(--warn-bg);border-left:4px solid var(--warn);padding:8px 10px;border-radius:0 6px 6px 0;font-size:14.5px}
.hint{font-size:13px;color:var(--muted);margin-top:-4px}
.opts{display:flex;flex-direction:column;gap:6px}
.opts.two{display:grid;grid-template-columns:1fr 1fr}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:15.5px;background:var(--surface)}
.opt input{margin:2px 0 0;width:20px;height:20px;accent-color:var(--accent);flex:none}
.opt.on{background:var(--sel);border-color:var(--accent)}
input[type=text],input[type=number],textarea,select.inp{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--ink)}
textarea{min-height:110px}
.msel{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;cursor:pointer;background:var(--surface);font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;color:var(--ink)}
.msel[aria-expanded="true"]{border-color:var(--accent)}
.msel span{flex:1;min-width:0}
.msel b{color:var(--accent)}
.msel-list{margin-top:-2px}
select.inp{background:var(--surface)}
.err{color:var(--danger);background:var(--danger-bg);font-size:14px;padding:7px 10px;border-radius:7px}
.note{font-size:15px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.note.info{background:var(--sel);border-color:var(--accent)}
.note.warn{background:var(--danger-bg);color:var(--danger);border-color:var(--danger);font-weight:700}
.note img{display:block;width:100%;margin-top:6px;border-radius:6px;background:#fff}
.ref{align-self:flex-start;border:2px dashed var(--warn);color:var(--warn);background:transparent;border-radius:20px;padding:8px 14px;font-weight:700;font-size:15px;cursor:pointer}
.ref[aria-pressed="true"]{border-style:solid;background:var(--warn-bg)}
.inst{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.inst-h{display:flex;justify-content:space-between;align-items:center;font-weight:700}
canvas.draw{width:100%;height:260px;border:1px solid var(--line);border-radius:9px;background:#fff;touch-action:none}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:10px;font-weight:700;z-index:30;max-width:90vw;text-align:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
[hidden]{display:none!important}
@media (max-width:360px){.opts.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="filein" accept=".zip,.json,application/zip,application/json" multiple hidden>
<script src="lib/xlsx.mini.min.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="form.js"></script>
<script src="app.js"></script>
</body>
</html>
